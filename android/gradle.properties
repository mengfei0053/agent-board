org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Debug-only signing. Not a Play Store or release secret.
# keystore/debug.keystore is checked in so a laptop and GitHub Actions
# (release-apk.yml assembleDebug) produce the same certificate. Successive
# debug APKs can then update tech.mengfei.agentboard in place.
# Passwords are the well-known Android debug passwords.
DEBUG_STORE_FILE=keystore/debug.keystore
DEBUG_STORE_PASSWORD=android
DEBUG_KEY_ALIAS=androiddebugkey
DEBUG_KEY_PASSWORD=android
