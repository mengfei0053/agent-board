name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android v3
      - uses: >-
          android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # PRs never receive production credentials, including same-repo PRs.
      - name: Assemble debug APK for pull request
        if: github.event_name == 'pull_request'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :protocol:test \
            :app:assembleDebug --stacktrace

      - name: Assemble production release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: >-
            ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: >-
            ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: >-
            ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/agent-board-release.jks
        run: |
          set -euo pipefail
          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?Missing release keystore}"
          : "${ANDROID_RELEASE_STORE_PASSWORD:?Missing release store password}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?Missing release key alias}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?Missing release key password}"
          umask 077
          trap 'rm -f "$ANDROID_RELEASE_STORE_FILE"' EXIT
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > "$ANDROID_RELEASE_STORE_FILE"
          cd android
          chmod +x ./gradlew
          ./gradlew :app:testReleaseUnitTest :protocol:test \
            :app:assembleRelease --stacktrace

      - name: Verify and name the APK
        id: apk
        env:
          BUILD_EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          variant=release
          if [[ "$BUILD_EVENT" == "pull_request" ]]; then variant=debug; fi
          metadata="android/app/build/outputs/apk/$variant/output-metadata.json"
          src=$(jq -er '.elements |
            if length == 1 then .[0].outputFile
            else error("Expected one APK") end' "$metadata")
          apk="android/app/build/outputs/apk/$variant/$src"
          test -f "$apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$apksigner" verify --verbose --print-certs \
            --min-sdk-version 30 "$apk"
          cert_out=$("$apksigner" verify --print-certs "$apk")
          badging=$("$aapt" dump badging "$apk")
          version=$(jq -er '.elements[0].versionName' "$metadata")
          version_code=$(jq -er '.elements[0].versionCode' "$metadata")
          normalize() {
            printf '%s' "$1" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]:'
          }
          actual=$(awk '/certificate SHA-256 digest:/ {
            sub(/^.*digest: */, ""); print; exit
          }' <<< "$cert_out")
          if [[ "$variant" == "release" ]]; then
            : "${ANDROID_RELEASE_CERT_SHA256:?Missing release fingerprint}"
            expected=$(normalize "$ANDROID_RELEASE_CERT_SHA256")
            [[ "$expected" =~ ^[0-9A-F]{64}$ ]]
            if [[ "$(normalize "$actual")" != "$expected" ]]; then
              echo 'Release signer mismatch' >&2; exit 1
            fi
            if grep -q '^application-debuggable' <<< "$badging"; then
              echo 'Production APK must not be debuggable' >&2; exit 1
            fi
            grep -Fq "package: name='tech.mengfei.agentboard'" <<< "$badging"
            grep -Fq "versionName='$version'" <<< "$badging"
            grep -Fq "versionCode='$version_code'" <<< "$badging"
            if [[ "$BUILD_EVENT" == "release" ]]; then
              if [[ "$version" != "${REF_NAME#v}" ]]; then
                echo 'Tag and APK versionName differ' >&2; exit 1
              fi
            fi
          fi
          tag="${REF_NAME//\//-}"
          short=$(git rev-parse --short=7 HEAD)
          dest="agent-board-${tag}-${short}-${variant}.apk"
          cp "$apk" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          echo "Verified $variant APK: version=$version code=$version_code"

      - name: Keep the APK as a workflow artifact
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach the APK to the GitHub Release
        if: github.event_name == 'release'
        # softprops/action-gh-release v2
        uses: >-
          softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
