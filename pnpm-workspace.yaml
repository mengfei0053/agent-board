packages:
  - website

allowBuilds:
  '@embedded-postgres/linux-x64': true
  embedded-postgres: true
  esbuild: true
  core-js: false
  core-js-pure: false
  better-sqlite3: true
  # BDK ships its CLI prebuilt; don't install its optional user-level skills.
  '@grok/agent-sdk': false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@grok/agent-sdk@0.7.2'

overrides:
  webpack: 5.101.3
