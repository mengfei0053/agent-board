<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>agent-board</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>agent-board</h1>
        <p class="muted">本机看板 · 草稿 / 新建 Todo 直接开跑 · pi / Claude / Cursor</p>
      </div>
      <div class="topbar-actions">
        <a class="btn-link secondary" href="/docs">接口文档</a>
        <input id="search" type="search" placeholder="搜索标题 / 目录 / prompt…" />
        <button type="button" id="btn-new" class="secondary">新建草稿</button>
        <button type="button" id="btn-new-todo" class="primary">新建 Todo</button>
      </div>
    </header>

    <section class="swimlanes" id="swimlanes">
      <div class="lane" data-tab="draft">
        <div class="lane-head"><h2>草稿</h2><span class="count" id="count-draft">0</span></div>
        <div class="lane-body cards" id="list-draft"></div>
      </div>
      <div class="lane" data-tab="todo">
        <div class="lane-head"><h2>Todo</h2><span class="count" id="count-todo">0</span></div>
        <div class="lane-body cards" id="list-todo"></div>
      </div>
      <div class="lane" data-tab="running">
        <div class="lane-head"><h2>进行中</h2><span class="count" id="count-running">0</span></div>
        <div class="lane-body cards" id="list-running"></div>
      </div>
      <div class="lane" data-tab="done">
        <div class="lane-head"><h2>已完成</h2><span class="count" id="count-done">0</span></div>
        <div class="lane-body cards" id="list-done"></div>
      </div>
    </section>
    <p id="empty" class="empty muted" hidden>没有匹配的任务</p>
  </div>

  <div id="bulk-bar" class="bulk-bar hidden" role="toolbar" aria-label="批量操作">
    <span id="bulk-count">已选 0</span>
    <button type="button" class="secondary" id="bulk-select-visible">全选当前筛选</button>
    <button type="button" class="secondary" id="bulk-clear">取消选择</button>
    <button type="button" class="danger" id="bulk-delete">批量删除</button>
  </div>

  <div id="create-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="create-title">新建草稿</h2>
        <button type="button" class="icon-btn" id="create-close" aria-label="关闭">×</button>
      </div>
      <p class="muted create-hint" id="create-hint">保存后进入「草稿」列；拖到 Todo 才会开始执行。</p>
      <form id="create-form">
        <label>Agent
          <select name="kind">
            <option value="pi">pi</option>
            <option value="claude">Claude Code</option>
            <option value="cursor">Cursor CLI (agent)</option>
          </select>
        </label>
        <label>标题（可选）
          <input name="title" placeholder="简短标题" />
        </label>
        <label>工作目录
          <div class="cwd-row">
            <input name="cwd" id="cwd-input" required placeholder="选择或粘贴路径" value="/home/menghongfei/projects/agent-board" />
            <button type="button" id="cwd-pick" class="secondary">选择文件夹</button>
          </div>
        </label>
        <label>Model（可选）
          <input name="model" placeholder="如 cn:glm-5.3 或 sonnet" />
        </label>
        <label>任务内容
          <textarea name="prompt" required rows="6" placeholder="要 Agent 做的事"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="secondary" id="create-cancel">取消</button>
          <button type="submit" class="primary" id="create-submit">保存草稿</button>
        </div>
        <p id="form-error" class="error" hidden></p>
      </form>
    </div>
  </div>

  <div id="detail-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card detail-card">
      <div class="detail-top">
        <div class="detail-top-main">
          <h2 id="detail-title">详情</h2>
          <p class="muted" id="detail-sub"></p>
        </div>
        <button type="button" class="icon-btn" id="detail-close" aria-label="关闭">×</button>
      </div>

      <div class="detail-body">
        <section class="detail-meta-grid" id="detail-meta-grid" aria-label="任务信息"></section>

        <section class="detail-sidejobs-section" id="detail-sidejobs-section" hidden>
          <div class="section-head">
            <h3>后台 / Monitor</h3>
            <span class="muted" id="sidejobs-hint"></span>
          </div>
          <div id="detail-sidejobs" class="detail-sidejobs"></div>
        </section>

        <section class="detail-output-section">
          <div class="section-head">
            <h3>最终输出</h3>
            <span class="muted" id="output-hint"></span>
          </div>
          <div id="detail-output" class="detail-output md-body"></div>
          <div id="detail-error" class="detail-error" hidden></div>
        </section>

        <details class="detail-log-wrap" id="log-wrap">
          <summary>原始日志 <span class="muted" id="log-count"></span></summary>
          <pre id="log" class="log"></pre>
        </details>

        <details class="detail-raw-meta" id="raw-meta-wrap">
          <summary>原始元数据 JSON</summary>
          <pre id="detail-meta" class="meta"></pre>
        </details>
      </div>

      <div class="detail-footer" id="detail-footer">
        <div class="detail-footer-actions">
          <button type="button" id="start-btn" class="primary" hidden>开始任务</button>
          <button type="button" id="stop-btn" class="danger" hidden>停止</button>
          <button type="button" id="delete-btn" class="danger secondary-danger" hidden>删除</button>
        </div>
        <div id="continue-row" class="continue-row footer-continue" hidden>
          <textarea id="continue-prompt" rows="2" placeholder="可选：补充续跑说明；留空则「请基于当前上下文继续完成任务」"></textarea>
          <div class="continue-actions">
            <button type="button" id="continue-btn" class="primary">继续任务</button>
            <span id="continue-hint" class="muted continue-hint"></span>
          </div>
          <p id="continue-error" class="error" hidden></p>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
