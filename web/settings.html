<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置 · agent-board</title>
  <script>
    (function () {
      try {
        var KEY = "agent-board.theme";
        var pref = localStorage.getItem(KEY) || "system";
        if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
        var resolved = pref === "system"
          ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : pref;
        document.documentElement.setAttribute("data-theme", resolved);
        document.documentElement.setAttribute("data-theme-pref", pref);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.setAttribute("data-theme-pref", "system");
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="docs-page settings-page">
  <div class="app docs-app">
    <header class="topbar">
      <div class="topbar-brand">
        <div class="brand-mark" aria-hidden="true">ab</div>
        <div>
          <h1>设置</h1>
          <p class="muted">快捷输入 · 按 Agent 配置 CLI 与代理</p>
        </div>
      </div>
      <div class="topbar-actions">
        <a class="btn-link secondary" href="/">← 返回看板</a>
        <a class="btn-link secondary" href="/docs">接口文档</a>
      </div>
    </header>

    <main class="docs-main settings-main">
      <section class="settings-card settings-pair-card" aria-labelledby="pair-code-title">
        <header class="settings-block-head">
          <h2 id="pair-code-title">手机配对</h2>
          <p class="settings-block-desc">为当前看板生成一次性配对码。管理员令牌仅用于本次请求，不会保存。</p>
        </header>
        <div class="settings-row">
          <label for="pair-admin-token">中继管理员令牌</label>
          <input id="pair-admin-token" type="password" autocomplete="off" />
        </div>
        <button type="button" id="btn-create-pair-code">生成配对码</button>
        <p id="pair-code-status" class="settings-status muted" role="status"></p>
        <div id="pair-code-result" hidden>
          <div class="settings-row"><label for="pair-code-value">配对码</label><input id="pair-code-value" type="text" readonly /></div>
          <button type="button" class="secondary" id="btn-copy-pair-code">复制配对码</button>
          <p id="pair-code-expiry" class="settings-block-desc"></p>
        </div>
      </section>
      <form id="settings-form" class="settings-form" autocomplete="off">
        <section class="settings-card settings-quick-card" aria-labelledby="quick-prompts-title">
          <header class="settings-block-head">
            <h2 id="quick-prompts-title">快捷输入</h2>
            <p class="settings-block-desc">自定义提示词按钮；会出现在新建任务与详情续跑输入框上方，点击后填入内容。</p>
          </header>
          <div id="quick-prompts-list" class="quick-prompt-list"></div>
          <div class="quick-prompt-actions">
            <button type="button" class="secondary" id="btn-add-quick-prompt">＋ 添加快捷输入</button>
          </div>
        </section>

        <div class="settings-kind-tabs" id="agent-tabs" role="tablist" aria-label="选择 Agent"></div>

        <div id="agent-panels" class="settings-agent-panels"></div>

        <div class="settings-sticky-bar" id="settings-sticky">
          <p class="settings-status muted" id="settings-status" role="status">加载中…</p>
          <div class="settings-actions">
            <button type="submit" id="btn-save-settings">保存</button>
            <button type="button" class="secondary" id="btn-clear-settings">全部恢复默认</button>
          </div>
        </div>
      </form>
    </main>
  </div>
  <script src="/settings.js" type="module"></script>
</body>
</html>
