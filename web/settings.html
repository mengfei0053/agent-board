<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置 · agent-board</title>
  <script>
    (function () {
      try {
        var KEY = "agent-board.theme";
        var pref = localStorage.getItem(KEY) || "system";
        if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
        var resolved = pref === "system"
          ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : pref;
        document.documentElement.setAttribute("data-theme", resolved);
        document.documentElement.setAttribute("data-theme-pref", pref);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.setAttribute("data-theme-pref", "system");
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="docs-page settings-page">
  <div class="app docs-app">
    <header class="topbar">
      <div class="topbar-brand">
        <div class="brand-mark" aria-hidden="true">ab</div>
        <div>
          <h1>设置</h1>
          <p class="muted">CLI 路径 · 各 Agent 进程代理</p>
        </div>
      </div>
      <div class="topbar-actions">
        <a class="btn-link secondary" href="/">← 返回看板</a>
        <a class="btn-link secondary" href="/docs">接口文档</a>
      </div>
    </header>

    <main class="docs-main settings-main">
      <p class="settings-status muted" id="settings-status" role="status">加载中…</p>

      <form id="settings-form" class="settings-form" autocomplete="off">
        <section class="settings-card" aria-labelledby="cli-heading">
          <header class="settings-card-head">
            <h2 id="cli-heading">CLI 路径</h2>
            <p class="settings-card-desc">
              非空覆盖用于后续 spawn；清空后恢复默认命令名（走 <code>PATH</code>）。
              持久化 <code>meta.cli_paths</code>。
            </p>
          </header>
          <div id="settings-fields" class="settings-fields"></div>
        </section>

        <section class="settings-card" aria-labelledby="proxy-heading">
          <header class="settings-card-head">
            <h2 id="proxy-heading">进程代理</h2>
            <p class="settings-card-desc">
              按 Agent 种类分别注入子进程环境（<code>spawn</code> / <code>spawnSync</code>）。
              某键为空则不覆盖，子进程继承看板进程环境。写入时同步小写别名（如 <code>http_proxy</code>）。
              持久化 <code>meta.proxy_env</code>（按 kind 分桶）。
            </p>
          </header>
          <div class="settings-kind-tabs" id="proxy-kind-tabs" role="tablist" aria-label="Agent 种类"></div>
          <div id="proxy-fields" class="settings-proxy-panels"></div>
        </section>

        <div class="settings-actions">
          <button type="submit" id="btn-save-settings">保存</button>
          <button type="button" class="secondary" id="btn-clear-settings">全部恢复默认</button>
        </div>
      </form>
    </main>
  </div>
  <script src="/settings.js" type="module"></script>
</body>
</html>
