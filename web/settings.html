<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置 · agent-board</title>
  <script>
    (function () {
      try {
        var KEY = "agent-board.theme";
        var pref = localStorage.getItem(KEY) || "system";
        if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
        var resolved = pref === "system"
          ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : pref;
        document.documentElement.setAttribute("data-theme", resolved);
        document.documentElement.setAttribute("data-theme-pref", pref);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.setAttribute("data-theme-pref", "system");
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="docs-page settings-page">
  <div class="app docs-app">
    <header class="topbar">
      <div class="topbar-brand">
        <div class="brand-mark" aria-hidden="true">ab</div>
        <div>
          <h1>设置</h1>
          <p class="muted">CLI 路径覆盖 · 子进程代理环境变量</p>
        </div>
      </div>
      <div class="topbar-actions">
        <a class="btn-link secondary" href="/">← 返回看板</a>
        <a class="btn-link secondary" href="/docs">接口文档</a>
      </div>
    </header>

    <main class="docs-main settings-main">
      <p class="muted" id="settings-status">加载中…</p>

      <form id="settings-form" class="settings-form" autocomplete="off">
        <section>
          <h2>CLI 路径</h2>
          <p>非空覆盖用于后续 spawn；清空后恢复默认命令名（PATH）。写入 <code>meta.cli_paths</code>。</p>
          <div id="settings-fields" class="settings-fields"></div>
        </section>

        <section class="settings-section">
          <h2>进程代理</h2>
          <p>注入到 Agent 子进程环境（<code>spawn</code> / <code>spawnSync</code>）。非空写入覆盖；空则不注入该项，子进程仍继承看板进程原有环境。同时会写入小写别名（如 <code>http_proxy</code>）。持久化 <code>meta.proxy_env</code>。</p>
          <div id="proxy-fields" class="settings-fields"></div>
        </section>

        <div class="settings-actions">
          <button type="submit" id="btn-save-settings">保存</button>
          <button type="button" class="secondary" id="btn-clear-settings">全部恢复默认</button>
        </div>
      </form>
    </main>
  </div>
  <script src="/settings.js" type="module"></script>
</body>
</html>
